<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Calendar · Northwind Ops</title>
<link rel="stylesheet" href="/static/app.css">
<style>
  .grid { display:grid; grid-template-columns: 56px repeat(4, 1fr); gap:0 8px; }
  .col { position:relative; height:640px; border-left:1px solid var(--line); background:repeating-linear-gradient(#fff 0 79px, var(--line) 79px 80px); }
  .hours { position:relative; height:640px; } .hours div { position:absolute; right:4px; font-size:11px; color:var(--muted); transform:translateY(-6px); }
  .block { position:absolute; left:4px; right:4px; background:#dbe6ff; border-left:3px solid var(--accent); border-radius:4px; font-size:12px; padding:2px 5px; overflow:hidden; }
  .who { font-weight:600; } .status { font-size:12px; color:#7a4b00; background:#fff3d6; border-radius:4px; padding:3px 6px; margin-top:4px; min-height:20px; }
  .layout { display:grid; grid-template-columns: 1fr 320px; gap:20px; align-items:start; }
  fieldset { border:1px solid var(--line); border-radius:6px; } legend { font-weight:600; font-size:13px; }
</style></head>
<body data-task="calendar">
<header class="bar"><span class="logo">Northwind Ops</span><span class="app">Calendar</span></header>
<main id="app"><div class="layout"><section class="card" aria-label="Team calendars"><h1 id="day"></h1><div id="heads" class="grid"></div><div id="grid" class="grid"></div></section>
<section class="card" aria-label="New event"><h2>New event</h2><div id="form"></div></section></div></main>
<div id="notice" role="status" hidden></div>
<script src="/static/app.js"></script>
<script>
(async () => {
  const { seed } = await api('data');
  document.getElementById('day').textContent = seed.day_label;
  const toMin = (t) => { const [a, b] = t.split(':').map(Number); return a * 60 + b; };
  const heads = document.getElementById('heads'), grid = document.getElementById('grid');
  heads.append(h('div', {}));
  const hours = h('div', { class: 'hours', 'aria-hidden': 'true' });
  for (let t = 9; t <= 17; t++) hours.append(h('div', { style: `top:${(t - 9) * 80}px` }, `${t}:00`));
  grid.append(hours);
  seed.people.forEach((p) => {
    heads.append(h('div', { 'aria-label': `${p.name} header` }, h('div', { class: 'who' }, p.name), h('div', { class: 'status' }, p.status ? `Status: ${p.status}` : 'No status')));
    const col = h('div', { class: 'col', role: 'list', 'aria-label': `${p.name}'s calendar` });
    p.busy.forEach(([s, e, label]) => col.append(h('div', { class: 'block', role: 'listitem', style: `top:${(toMin(s) - 540) * 80 / 60}px;height:${(toMin(e) - toMin(s)) * 80 / 60 - 2}px` }, `${s}–${e} ${label}`)));
    grid.append(col);
  });
  const times = [];
  for (let m = 9 * 60; m < 17 * 60; m += 15) times.push(`${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`);
  const title = h('input', { type: 'text', placeholder: 'Event title' });
  const day = select(seed.days, seed.days[0]);
  const start = select(times, '09:00');
  const duration = select(seed.durations.map((d) => [String(d), `${d} min`]), '30');
  const boxes = seed.attendees.map((a) => h('input', { type: 'checkbox', value: a, id: uid('att') }));
  const fs = h('fieldset', {}, h('legend', {}, 'Attendees'), boxes.map((b) => h('div', {}, b, h('label', { for: b.id }, ' ' + b.value))));
  const create = h('button', { class: 'primary', onclick: async () => {
    await api('submit', { title: title.value, day: day.value, start: start.value, duration: duration.value, attendees: boxes.filter((b) => b.checked).map((b) => b.value) });
    notice(`Event "${title.value}" created.`);
  } }, 'Create event');
  document.getElementById('form').append(field('Title', title), field('Day', day), field('Start time', start), field('Duration', duration), fs, h('div', { class: 'actions' }, create));
})();
</script></body></html>
