<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Procurement · Northwind Ops</title>
<link rel="stylesheet" href="/static/app.css">
<style>
  .pinned { background:#fff8e1; border:1px solid #f0d98a; border-radius:6px; padding:10px; margin-bottom:12px; }
  .msg { padding:8px 0; border-bottom:1px solid var(--line); } .msg .who { font-weight:600; } .msg .time { color:var(--muted); font-size:12px; margin-left:6px; }
  td input[type=number] { width:70px; }
</style></head>
<body data-task="po">
<header class="bar"><span class="logo">Northwind Ops</span><span class="app">Chat · Purchasing</span></header>
<main id="app"><div class="cols"><section class="card" aria-label="#procurement channel"><h2># procurement</h2><div id="feed"></div></section>
<section class="card" aria-label="PO sheet"><h2>PO sheet · week of Oct 26</h2><div id="sheet"></div></section></div></main>
<div id="notice" role="status" hidden></div>
<script src="/static/app.js"></script>
<script>
(async () => {
  const { seed } = await api('data');
  const feed = document.getElementById('feed');
  feed.append(h('div', { class: 'pinned', 'aria-label': 'Pinned message' }, h('strong', {}, '📌 Pinned: '), seed.policy));
  seed.messages.forEach((m) => feed.append(h('div', { class: 'msg' }, h('span', { class: 'who' }, m.who), h('span', { class: 'time' }, m.time), h('div', {}, m.text))));
  const rows = seed.rows.map((r) => {
    const qty = h('input', { type: 'number', min: '0', value: r.qty, 'aria-label': `${r.id} quantity` });
    const total = h('td', {}, money(r.qty * r.unit));
    qty.addEventListener('input', () => { total.textContent = money((Number(qty.value) || 0) * r.unit); });
    const status = select(seed.statuses, 'Pending', { 'aria-label': `${r.id} status` });
    return { r, qty, status, tr: h('tr', {}, h('td', {}, r.id), h('td', {}, r.item), h('td', {}, qty), h('td', {}, money(r.unit)), total, h('td', {}, status)) };
  });
  const table = h('table', {}, h('thead', {}, h('tr', {}, ['Request', 'Item', 'Qty', 'Unit', 'Line total', 'Status'].map((t) => h('th', {}, t)))), h('tbody', {}, rows.map((x) => x.tr)));
  const submit = h('button', { class: 'primary', onclick: async () => {
    await api('submit', { rows: rows.map((x) => ({ id: x.r.id, qty: x.qty.value, status: x.status.value })) });
    notice('PO sheet submitted.');
  } }, 'Submit PO sheet');
  document.getElementById('sheet').append(table, h('div', { class: 'actions' }, submit));
})();
</script></body></html>
