<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Inventory · Northwind Ops</title>
<link rel="stylesheet" href="/static/app.css">
<style> td input[type=text] { width:120px; } td.num { text-align:right; font-variant-numeric:tabular-nums; } tfoot td { font-weight:600; } </style></head>
<body data-task="sheet">
<header class="bar"><span class="logo">Northwind Ops</span><span class="app">Inventory</span></header>
<main id="app"><h1>Inventory sheet · IT closet, 3rd floor</h1><section class="card" id="sheet" aria-label="Inventory sheet"></section></main>
<div id="notice" role="status" hidden></div>
<script src="/static/app.js"></script>
<script>
(async () => {
  const { seed } = await api('data');
  const rows = seed.rows.map((r) => {
    const value = h('input', { type: 'text', placeholder: '0.00', 'aria-label': `${r.sku} stock value` });
    const reorder = h('input', { type: 'checkbox', 'aria-label': `${r.sku} reorder` });
    return { r, value, reorder, tr: h('tr', {}, h('td', {}, r.sku), h('td', {}, r.item), h('td', { class: 'num' }, String(r.on_hand)), h('td', { class: 'num' }, money(r.unit)), h('td', {}, value), h('td', {}, reorder)) };
  });
  const total = h('input', { type: 'text', placeholder: '0.00', 'aria-label': 'Total stock value' });
  const table = h('table', {},
    h('thead', {}, h('tr', {}, ['SKU', 'Item', 'On hand', 'Unit cost', 'Stock value', 'Reorder'].map((t) => h('th', {}, t)))),
    h('tbody', {}, rows.map((x) => x.tr)),
    h('tfoot', {}, h('tr', {}, h('td', { colspan: '4' }, 'Total stock value'), h('td', {}, total), h('td', {}))));
  const save = h('button', { class: 'primary', onclick: async () => {
    await api('submit', { rows: rows.map((x) => ({ sku: x.r.sku, value: x.value.value, reorder: x.reorder.checked })), total: total.value });
    notice('Sheet saved.');
  } }, 'Save sheet');
  document.getElementById('sheet').append(table, h('div', { class: 'actions' }, save));
})();
</script></body></html>
