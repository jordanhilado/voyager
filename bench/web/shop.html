<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Gearhouse · Northwind Ops</title>
<link rel="stylesheet" href="/static/app.css">
<style>
  .tabs { display:flex; gap:6px; margin-bottom:14px; } .tabs button[aria-selected=true] { background:#e3eafb; font-weight:600; }
  .shop { display:grid; grid-template-columns: 200px 1fr; gap:20px; align-items:start; }
  .products { display:grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap:12px; }
  .product .price { font-size:18px; font-weight:700; } .product .rating { color:#9a6700; }
  .promo { border:1px dashed #b9c1cc; border-radius:6px; padding:10px; margin-bottom:10px; } .promo code { font-weight:700; font-size:15px; }
  .totals .r { display:flex; justify-content:space-between; max-width:320px; }
</style></head>
<body data-task="shop">
<header class="bar"><span class="logo">Northwind Ops</span><span class="app">Gearhouse · equipment store</span></header>
<main id="app"><nav class="tabs" role="tablist" id="tabs" aria-label="Store sections"></nav><div id="view"></div></main>
<div id="notice" role="status" hidden></div>
<script src="/static/app.js"></script>
<script>
let seed, cart = {}, view = 'Catalog', filters = new Set(), sort = 'featured', couponMsg = '';
const byId = (id) => seed.products.find((p) => p.id === id);
async function act(body) {
  const r = await api('action', body);
  cart = r;
  if (!r.ok && r.error) couponMsg = r.error;
  return r;
}
function tabs() {
  const n = Object.values(cart.cart || {}).reduce((a, b) => a + b, 0);
  document.getElementById('tabs').replaceChildren(...['Catalog', 'Promotions', `Cart (${n})`].map((label) => {
    const key = label.startsWith('Cart') ? 'Cart' : label;
    return h('button', { role: 'tab', 'aria-selected': String(view === key), onclick: () => { view = key; render(); } }, label);
  }));
}
function catalog() {
  const cats = [...new Set(seed.products.map((p) => p.cat))];
  const side = h('aside', { class: 'card', 'aria-label': 'Filters' }, h('h2', {}, 'Category'), ...cats.map((c) => {
    const b = h('input', { type: 'checkbox', id: uid('cat'), checked: filters.has(c) });
    b.addEventListener('change', () => { b.checked ? filters.add(c) : filters.delete(c); render(); });
    return h('div', { class: 'opt' }, b, h('label', { for: b.id }, ' ' + c));
  }), h('h2', { style: 'margin-top:14px' }, 'Sort'), (() => {
    const s = select([['featured', 'Featured'], ['price-asc', 'Price: low to high'], ['price-desc', 'Price: high to low'], ['rating', 'Rating']], sort, { 'aria-label': 'Sort by' });
    s.addEventListener('change', () => { sort = s.value; render(); });
    return s;
  })());
  let items = seed.products.filter((p) => !filters.size || filters.has(p.cat));
  if (sort === 'price-asc') items.sort((a, b) => a.price - b.price);
  if (sort === 'price-desc') items.sort((a, b) => b.price - a.price);
  if (sort === 'rating') items.sort((a, b) => b.rating - a.rating);
  const grid = h('div', { class: 'products' }, items.map((p) => h('article', { class: 'card product', 'aria-label': p.name },
    h('div', { class: 'muted' }, p.cat), h('h2', {}, p.name), h('div', {}, p.specs),
    h('div', { class: 'rating' }, `★ ${p.rating.toFixed(1)} out of 5`), h('div', { class: 'price' }, money(p.price)),
    h('div', { class: 'actions' }, h('button', { class: 'primary', 'aria-label': `Add ${p.name} to cart`, onclick: async () => { await act({ op: 'add', id: p.id }); notice(`Added ${p.name} to the cart.`); render(); } }, 'Add to cart')))));
  return h('div', { class: 'shop' }, side, h('section', { 'aria-label': 'Products' }, h('p', { class: 'muted' }, `${items.length} products`), grid));
}
function promos() {
  return h('section', { class: 'card', 'aria-label': 'Promotions' }, h('h2', {}, 'Current promotions'),
    ...seed.promotions.map((p) => h('div', { class: 'promo' }, h('code', {}, p.code), h('div', {}, p.text), h('div', { class: 'muted' }, `Terms: ${p.terms}`))),
    h('p', { class: 'muted' }, 'One coupon per order. Enter codes in the cart.'));
}
function totals() {
  return h('div', { class: 'totals' }, h('div', { class: 'r' }, h('span', {}, 'Subtotal'), h('span', {}, money(cart.subtotal || 0))),
    h('div', { class: 'r' }, h('span', {}, `Discount${cart.coupon ? ' (' + cart.coupon + ')' : ''}`), h('span', {}, '−' + money(cart.discount || 0))),
    h('div', { class: 'r' }, h('strong', {}, 'Total'), h('strong', {}, money(cart.total || 0))));
}
function cartView() {
  const ids = Object.keys(cart.cart || {});
  const code = h('input', { type: 'text', placeholder: 'Coupon code', 'aria-label': 'Coupon code', style: 'width:180px' });
  return h('section', { class: 'card', 'aria-label': 'Cart' }, h('h2', {}, 'Your cart'),
    ids.length ? h('table', {}, h('thead', {}, h('tr', {}, ['Item', 'Price', 'Qty', ''].map((t) => h('th', {}, t)))), h('tbody', {}, ids.map((id) => {
      const p = byId(id);
      const q = h('input', { type: 'number', min: '0', value: cart.cart[id], 'aria-label': `${p.name} quantity`, style: 'width:64px' });
      q.addEventListener('change', async () => { await act({ op: 'qty', id, qty: Number(q.value) }); render(); });
      return h('tr', {}, h('td', {}, p.name), h('td', {}, money(p.price)), h('td', {}, q), h('td', {}, h('button', { 'aria-label': `Remove ${p.name}`, onclick: async () => { await act({ op: 'remove', id }); render(); } }, 'Remove')));
    }))) : h('p', { class: 'muted' }, 'Your cart is empty.'),
    h('div', { class: 'row', style: 'margin:14px 0' }, code, h('button', { onclick: async () => {
      couponMsg = ''; const r = await act({ op: 'coupon', code: code.value }); if (r.ok) couponMsg = `Coupon ${r.coupon} applied.`; render();
    } }, 'Apply'), cart.coupon ? h('button', { onclick: async () => { couponMsg = ''; await act({ op: 'clear_coupon' }); render(); } }, `Remove coupon ${cart.coupon}`) : null),
    couponMsg ? h('p', { role: 'alert' }, couponMsg) : null, totals(),
    h('div', { class: 'actions' }, h('button', { class: 'primary', onclick: async () => { const r = await act({ op: 'review' }); if (r.ok) view = 'Review'; render(); } }, 'Continue to review')));
}
function review() {
  const ids = Object.keys(cart.cart || {});
  return h('section', { class: 'card', 'aria-label': 'Order review' }, h('h1', {}, 'Review your order'),
    h('ul', {}, ids.map((id) => h('li', {}, `${byId(id).name} × ${cart.cart[id]}: ${money(byId(id).price * cart.cart[id])}`))), totals(),
    h('p', { class: 'muted' }, 'Ships to: Northwind Labs, 200 Clarendon St, Boston MA. Payment: company card ending 4421.'),
    cart.placed ? h('p', { role: 'alert' }, 'Order placed. Confirmation #GH-88412.') : h('div', { class: 'actions' },
      h('button', { onclick: () => { view = 'Cart'; render(); } }, 'Back to cart'),
      h('button', { class: 'danger', onclick: async () => { await act({ op: 'place' }); render(); } }, 'Place order')));
}
function render() {
  tabs();
  document.getElementById('view').replaceChildren(({ Catalog: catalog, Promotions: promos, Cart: cartView, Review: review })[view]());
}
(async () => { seed = (await api('data')).seed; await act({ op: 'get' }); render(); })();
</script></body></html>
